<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herbalife AI Wellness Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="text-slate-900 flex flex-col min-h-screen">
<nav class="glass-nav sticky top-0 z-50 border-b border-slate-200/60 p-4"><div class="container mx-auto max-w-2xl flex justify-between"><div class="font-extrabold">Herbalife AI Wellness</div><button id="assistant-toggle" onclick="toggleAssistant()" class="bg-slate-900 text-white px-3 py-1 rounded-lg text-xs">Pause Assistant</button></div></nav>
<main class="flex-grow container mx-auto p-4 max-w-2xl">
<header id="hero-section" class="py-8 text-center"><h1 class="text-3xl font-extrabold">Your Health, AI Guided</h1></header>
<section id="auth-section" class="bg-white p-6 rounded-2xl card-shadow border"><input id="member-id-input" placeholder="Enter Member ID" class="w-full p-3 border rounded-xl mb-3" /><button onclick="analyzeUser()" class="w-full bg-slate-900 text-white p-3 rounded-xl">Initialize AI Engine</button><div id="error-box" class="hidden"><p id="error-msg"></p></div></section>
<div id="loading-ai" class="hidden py-8">Loading...</div>
<section id="dashboard" class="hidden space-y-4 pb-20">
<div class="coach-gradient p-6 rounded-2xl text-white"><h2 id="user-name">---</h2><p id="user-id-display">---</p><div class="grid grid-cols-3 gap-2 mt-4"><div><p id="user-weight">--</p></div><div><p id="user-bmi">--</p></div><div><p id="user-ideal">--</p></div></div></div>
<div class="bg-slate-900 p-4 rounded-2xl text-white"><p id="ai-feedback">---</p><div id="bmi-label"></div><p id="assistant-log" class="text-xs text-slate-300 mt-2">Assistant live listening...</p></div>
<div class="bg-slate-200/50 p-1.5 rounded-2xl flex gap-1"><button id="btn-diet" onclick="showTab('diet')" class="flex-1 py-2 rounded-xl tab-active">AI Protocol</button><button id="btn-habits" onclick="showTab('habits')" class="flex-1 py-2 rounded-xl">Wellness</button></div>
<div id="view-diet" class="space-y-3"></div>
<div id="view-habits" class="hidden space-y-4">
<div class="bg-white p-5 rounded-2xl border"><h3>Hydration</h3><span id="water-text">0.00</span><div class="h-3 bg-slate-100 rounded-full"><div id="water-progress-bar" class="h-full bg-blue-500" style="width:0%"></div></div><button onclick="addWater()" class="mt-3 bg-blue-600 text-white px-3 py-2 rounded-lg">Add 250ml</button></div>
<div class="bg-white p-5 rounded-2xl border"><h3>AI Task Manager</h3><p class="text-xs">Online class join time: 6:30 AM & 5:00 PM</p><div class="flex gap-2 my-3"><button id="btn-daily" class="task-btn tab-active px-2 py-1 rounded-lg border" onclick="renderTasks('daily')">Daily</button><button id="btn-weekly" class="task-btn px-2 py-1 rounded-lg border" onclick="renderTasks('weekly')">Weekly</button><button id="btn-monthly" class="task-btn px-2 py-1 rounded-lg border" onclick="renderTasks('monthly')">Monthly</button></div><video id="live-camera" autoplay muted class="hidden w-full rounded-xl mb-2"></video><div id="routine-list" class="space-y-2"></div><div class="mt-3"><span id="task-progress-text">0%</span><div class="h-3 bg-slate-100 rounded-full"><div id="task-progress-bar" class="h-full bg-indigo-500" style="width:0%"></div></div></div></div>
<div class="bg-white p-5 rounded-2xl border"><h3>Calendar Completion</h3><div id="task-calendar" class="grid gap-2"></div></div>
<div class="bg-white p-5 rounded-2xl border"><h3>Progress Chart</h3><div id="progress-chart" class="space-y-1"></div></div>
</div>
</section>
</main>
<footer class="p-6 text-center bg-slate-50 border-t"><p class="text-xs">© 2024 Herbalife Nutrition</p><a class="text-sm text-green-700 font-bold" href="https://herbalife-smart-wellness-studio.my.canva.site/page-2" target="_blank">Go to Main Website</a></footer>
<script src="data.js"></script>
<script src="storage.js"></script>
<script src="plans.js"></script>
<script src="voice.js"></script>
<script src="tasks.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
